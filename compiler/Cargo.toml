[package]
name = "compiler"
version = "0.1.0"
edition = "2024"

[lib]
name = "compiler"
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
typst = "0.14.2"
typst-as-lib = { version = "0.15.4", features = ["packages", "ureq", "typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-pdf = "0.14.2"
